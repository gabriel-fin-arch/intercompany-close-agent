name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      # The versions in uv.lock, exactly; --locked fails the job if the lock
      # no longer matches pyproject, rather than quietly resolving new ones.
      - name: Install dependencies
        run: uv sync --locked --extra dev

      # ruff and the rest of .pre-commit-config.yaml, on every file, so the
      # hooks a contributor runs and the checks CI runs are the same list.
      - name: Lint and pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Type check
        run: uv run mypy

      # Coverage goes to the job summary, where anyone looking at a run can see
      # it, with no third-party service.
      - name: Test, with coverage
        run: |
          uv run pytest -q --cov --cov-report=term
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test the pipeline offline
        run: |
          uv run python -m intercompany_close_agent.cli generate-data
          uv run python -m intercompany_close_agent.cli run

      - name: Score triage offline on the labelled and adversarial sets
        # The rules and the taxonomy check, with no API key. Exits 1 if any
        # case gets a classification other than the one its set expects. The
        # test step above also runs the taxonomy check alone on both sets,
        # behind a classifier that answers auto_resolvable to everything.
        run: |
          uv run python -m intercompany_close_agent.cli triage-eval --set labelled
          uv run python -m intercompany_close_agent.cli triage-eval --set adversarial

  recalc:
    # recalc/ic_recalc.sql is the accountant's own recalculation of the sample
    # close, in plain SQL (recalc/README.md). This runs it and the offline
    # pipeline on the same CSVs and fails on any difference in the tie-out, the
    # matching or the eliminated total; the job summary shows both sides.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Reconcile recalc/ against the pipeline
        # An explicit bash runs with -o pipefail, so a failing check isn't
        # hidden behind tee's exit status.
        shell: bash
        run: uv run python -m intercompany_close_agent.recalc_check | tee -a "$GITHUB_STEP_SUMMARY"

  provenance:
    # The published history against the real dates on record
    # (.github/provenance.toml). Fails on a rewrite of the history restored on
    # 15 October 2026, a second first commit, a commit dated before that
    # restoration or in the future, a published commit count the history no
    # longer shows, and, on a push, a previous tip the new history doesn't
    # contain. It only reads.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, not just the last commit.
          fetch-depth: 0

      - name: Check the history against the dates on record
        # An explicit bash runs with -o pipefail, so a failing check isn't
        # hidden behind tee's exit status.
        shell: bash
        env:
          # The branch's tip before a push; empty on a pull request.
          PREVIOUS: ${{ github.event.before }}
        run: python3 src/intercompany_close_agent/provenance_check.py --previous "$PREVIOUS" | tee -a "$GITHUB_STEP_SUMMARY"

  container:
    # The image a reviewer can run without Python or uv: built from this
    # commit, the offline close run in it, and the dashboard started from it
    # and asked whether it's up.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the image
        run: docker build -t intercompany-close-agent .

      - name: Run the offline close in it
        run: |
          docker run --rm intercompany-close-agent | tee close.txt
          grep -q "Triage mode: offline rule-based fallback" close.txt
          grep -q "Reviewer worklist" close.txt

      - name: Start the dashboard from it
        run: |
          docker run -d --name dashboard -p 8501:8501 intercompany-close-agent \
            streamlit run app/streamlit_app.py --server.address=0.0.0.0 --server.headless=true
          for attempt in $(seq 30); do
            curl -sf http://localhost:8501/_stcore/health && exit 0
            sleep 2
          done
          docker logs dashboard
          exit 1

  lowest-versions:
    # The floors in pyproject are a promise the job above never tests: it
    # resolves to the newest of everything. This one installs the oldest
    # versions the constraints allow, which is how several floors turned out
    # to be versions the code could not run on.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Install the lowest versions pyproject allows
        # Resolves afresh, ignoring uv.lock: the floors are a different set of
        # versions from the pinned one, and this job is the only one that tests them.
        run: uv sync --extra dev --resolution lowest-direct

      - name: Test
        run: uv run pytest -q
