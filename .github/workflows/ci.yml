name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

      - name: Smoke-test the pipeline offline
        run: |
          uv run python -m intercompany_close_agent.cli generate-data
          uv run python -m intercompany_close_agent.cli run

  lowest-versions:
    # The floors in pyproject are a promise the job above never tests: it
    # resolves to the newest of everything. This one installs the oldest
    # versions the constraints allow, which is how several floors turned out
    # to be versions the code could not run on.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Install the lowest versions pyproject allows
        run: uv sync --extra dev --resolution lowest-direct

      - name: Test
        run: uv run pytest -q
