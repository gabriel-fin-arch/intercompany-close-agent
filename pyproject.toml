[project]
name = "intercompany-close-agent"
version = "0.1.0"
description = "Agent-first assistant for the intercompany leg of a multi-entity consolidation close."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gabriel S." }]
keywords = ["consolidation", "accounting", "langgraph", "agent", "intercompany"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "pydantic>=2.6",
    "typer>=0.16",
    "langgraph>=0.2",
    # Imported directly (graph.py builds the serializer itself), and
    # allowed_msgpack_modules only exists from 4.0.1.
    "langgraph-checkpoint>=4.0.1",
    # Older versions force a tool call for with_structured_output, which
    # Claude Opus 5.5, Sonnet 5.5 and Fable 5.1 reject with a 400.
    "langchain-anthropic>=1.7.3",
    "langchain-core>=0.3",
    "streamlit>=1.35",
    "python-dotenv>=1.0",
    "starlette>=0.46,<1.4",
    # Reads the close inputs from an .xlsx workbook (ingest/loaders.py).
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=4.4",
    "types-openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intercompany_close_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer's whole API is built on calling Option()/Argument() in the signature
# defaults, so B008 fires on every command it defines.
"src/intercompany_close_agent/cli.py" = ["B008"]
